server:
    port: 8080

spring:
    application:
    name: rentamovil-backend

datasource:
    url: jdbc:mysql://localhost:3307/renta_movil?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
    hibernate:
    ddl-auto: update
    show-sql: true
    properties:
        hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect